name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{github.workflow}}

permissions: {}
jobs:
  release:
    if: github.repository == 'realfakenerd/mizzle'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: |
          bun run build
          if [ -n "$(git status --porcelain)" ]; then
          echo "Generated files are outdated. Run 'bun run build' locally."
          git status
          exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
