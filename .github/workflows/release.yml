name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{github.workflow}}

permissions: {}
jobs:
    release:
        if: github.repository == 'realfakenerd/mizzle'
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: oven-sh/setup-bun@2
              with:
                  bun-version: 1.3.5

            - name: Install
              run: bun install --frozen-lockfile

            - name: Build
              run: |
                  bun run build
                  if [ -n "$(git status --porcelain)" ]; then
                  echo "Arquivos gerados estao desatualizados. Rode 'bun run build' localmente."
                  git status
                  exit 1
                  fi

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v1
              with:
                  version: bun run changeset:version
                  publish: bun run changeset:publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
